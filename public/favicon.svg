<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Shiva Gunuru">
  <!-- Ink tile, white monogram: the same inversion the hero's solid CTA pill
       uses. A favicon has to survive being 16px on a browser tab, so this is a
       high-contrast block rather than a drawing. The previous version rendered
       the particle-head motif in the old violet palette, and both the motif and
       the palette are gone. -->
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <text
    x="32"
    y="33"
    fill="#ffffff"
    font-family="Syne, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="800"
    letter-spacing="-1.2"
    text-anchor="middle"
    dominant-baseline="central"
  >SG</text>
</svg>
